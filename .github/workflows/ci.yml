name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check Cloudflare Pages config is present in the build
        run: |
          for f in dist/_headers dist/_redirects dist/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected $f in build output"
              exit 1
            fi
          done
          echo "Build output contains the Cloudflare Pages routing/header files."
