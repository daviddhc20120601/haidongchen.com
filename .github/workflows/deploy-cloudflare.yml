name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# This Cloudflare Pages project is Git-integrated with gh-pages as its
# production branch. Build master, publish dist/ to gh-pages, then Cloudflare
# deploys that branch and serves it on haidongchen.com.
permissions:
  contents: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build to production branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          npx gh-pages \
            --dist dist \
            --branch gh-pages \
            --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --message "Deploy ${SOURCE_SHA}"

      # A green workflow now means the custom domain is serving this release,
      # not merely that files were pushed to the deployment branch.
      - name: Verify haidongchen.com updated
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 15 \
              --header "Cache-Control: no-cache" \
              https://haidongchen.com/ \
              | grep --quiet "GPU AI Factory Principal Engineer"; then
              echo "haidongchen.com is serving the new site."
              exit 0
            fi
            echo "Waiting for Cloudflare deployment (${attempt}/30)..."
            sleep 10
          done
          echo "::error::Cloudflare did not update haidongchen.com within five minutes."
          exit 1
